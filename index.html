<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 디지털혁신 백서 장별 검색</title>
<style>
body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;margin:0;background:#f4f6f9;color:#222}
header{background:#1f3a5f;color:#fff;padding:20px;display:flex;align-items:center;gap:16px}
header img{height:48px;border:1px solid #fff}
h1{font-size:20px;margin:0}
main{max-width:900px;margin:0 auto;padding:16px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #aab;border-radius:6px}
#count{margin:12px 0;font-weight:bold}
.card{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.card h2{font-size:17px;margin:0 0 6px}
.no{display:inline-block;background:#1f3a5f;color:#fff;border-radius:4px;padding:1px 8px;margin-right:6px;font-size:14px}
.card p{margin:0;color:#444}
details{margin-top:8px}
pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 0}
mark{background:#ffe066}
#ext{margin-top:24px}
iframe{width:100%;height:320px;border:1px solid #ccc}
</style>
</head>
<body>
<header>
  <!-- 외부 리소스(이미지): Wikimedia Commons의 태극기 -->
  <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_South_Korea.svg?width=120" alt="대한민국 국기">
  <h1>2026 행정안전부 디지털혁신 백서 · 장별 검색</h1>
</header>
<main>
  <input id="q" type="search" placeholder="제목 또는 본문 키워드 (예: 예산, 국장)" autofocus>
  <div id="count"></div>
  <div id="list"></div>
  <section id="ext">
    <!-- 외부 리소스(Google Sheets): 웹에 게시한 시트를 iframe으로 임베드 -->
    <div id="sheet"></div>
  </section>
</main>
<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSFT7X1ETWTU88lVgYPpyyHx-FxxXUC-Ff-Wq5fMtv-IxgQs6g_eJBSplzI6XJ2K7JwB6sT3sL5uz6h/pubhtml?gid=780108088&single=true&widget=true&headers=false";
const FALLBACK = [{"장": "1", "제목": "개요", "본문": "본 백서는 2026년 행정안전부 디지털혁신과가 추진하는 **총 50건의 사업**과 **총 예산 6,700억원**의 종합 성과를 정리한 자료다. 사업 운영 기간은 2026년 1월 1일부터 **2026-12-31**까지이며, **디지털혁신과**이 총괄한다. 주관 국장은 **한지원** 국장이다."}, {"장": "2", "제목": "사업 규모", "본문": "행정안전부 디지털혁신과는 2026년 한 해 **50건의 사업**을 5대 분야로 묶어 추진한다. 디지털혁신·재난안전·민원혁신·정보보안·자치행정 5개 분야가 균등하게 배분돼 있으며, **디지털혁신과**이 5분야 전체를 총괄 조율한다.\n\n총 투입 예산은 **6,700억원**으로 전년 대비 12% 증가했다."}, {"장": "3", "제목": "추진 일정", "본문": "전체 사업은 2026년 1월 1일에 일제히 착수해 같은 해 **2026-12-31**까지 12개월간 운영된다. 분기별 점검회의는 분기마다 디지털혁신과 회의실에서 진행된다.\n\n**한지원** 국장은 분기별 점검회의를 직접 주재하며, 분야별 추진 상황을 종합 점검한다."}, {"장": "4", "제목": "분야별 세부 사항", "본문": "### 4.1 디지털혁신 분야\n\n디지털혁신 분야는 10개 사업으로 구성됐다. 부서 분담은 **디지털혁신추진과**이 5건, 공공데이터정책과가 3건, 정보화기획관실이 2건이다.\n\n### 4.2 재난안전 분야\n\n재난안전 분야는 10개 사업으로, 재난관리정책과·재난경감과·안전정책총괄과가 분담한다. 예산은 약 1,300억원이다.\n\n### 4.3 민원혁신 분야\n\n민원혁신 분야 10개 사업의 종료 시점은 2026년 12월 말로, 정확한 일자는 **2026-12-30**이다.\n\n### 4.4 정보보안 분야\n\n정보보안 분야는 10개 사업이 운영된다. 분야 총 예산은 1,300억원 수준이다.\n\n### 4.5 자치행정 분야\n\n자치행정 분야 역시 10개 사업이 운영된다. 분야 합계 예산은 약 900억원이다."}, {"장": "5", "제목": "성과 요약", "본문": "본 백서가 다루는 사업의 **총 건수는 48건**이며 누적 예산은 **6,500억원**으로 보고된다.\n\n전체 사업의 책임자는 **한지연** 국장으로, 분기별 보고 회의를 주재했다.\n\n분야별 성과는 별도 첨부 통계 보고서로 갈음하며, 본 백서는 종합 정리용 자료다."}, {"장": "6", "제목": "결론", "본문": "행정안전부 디지털혁신과는 2026년 한 해 동안 디지털혁신 5대 분야에서 총 50건의 사업을 안정적으로 운영했으며, 총 6,700억원의 예산을 균형 있게 집행했다.\n\n향후 2027년 사업 계획 수립 시 본 백서의 일관성을 면밀히 검토할 필요가 있다."}];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plain = s => s.replace(/\*\*/g,"").replace(/^#+\s*/gm,"").replace(/\s+/g," ").trim();
let data = [];

function render() {
  const k = $("q").value.trim();
  const rows = data.filter(a => !k || a["제목"].includes(k) || a["본문"].includes(k));
  $("count").textContent = "결과 " + rows.length + "건";
  const hl = t => k ? esc(t).split(esc(k)).join("<mark>" + esc(k) + "</mark>") : esc(t);
  $("list").innerHTML = rows.map(a => {
    const p = plain(a["본문"]);
    const sum = p.length > 90 ? p.slice(0, 90) + "…" : p;
    return '<div class="card"><h2><span class="no">' + esc(a["장"]) + '장</span>' + hl(a["제목"]) + '</h2>' +
      '<p>' + hl(sum) + '</p><details><summary>본문 전체</summary><pre>' + hl(a["본문"].replace(/\*\*/g,"")) + '</pre></details></div>';
  }).join("");
}

if (SHEET_URL) $("sheet").innerHTML = '<h3>Google Sheets</h3><iframe src="' + esc(SHEET_URL) + '"></iframe>';

fetch("장데이터.json").then(r => r.json()).catch(() => FALLBACK).then(d => { data = d; render(); });
$("q").addEventListener("input", render);
</script>
</body>
</html>
